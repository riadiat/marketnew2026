name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A second push while the first is still running waits
# rather than racing it through git reset --hard.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  lint:
    name: PHP 8.3 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Catches a broken file before it reaches the server. Vendor trees are
      # excluded: they carry known-unparseable files from dead payment SDKs
      # (see docs/PHP83-NOTES.md), none of which are ever loaded.
      - name: Lint
        run: |
          find public_html -name '*.php' \
            -not -path '*/storage/vendor/*' \
            -print0 | xargs -0 -P 4 -n 1 php -l > /dev/null

  deploy:
    name: Deploy to DigitalOcean
    needs: lint
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            DEPLOY_HEALTHCHECK_URL='${{ secrets.DEPLOY_HEALTHCHECK_URL }}' ./scripts/deploy.sh
