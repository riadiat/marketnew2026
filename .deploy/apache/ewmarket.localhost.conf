# Local development vhost — Apache + PHP-FPM 8.3.
#
# Install with:
#   sudo cp .deploy/apache/ewmarket.localhost.conf /etc/apache2/sites-available/
#   sudo a2ensite ewmarket.localhost && sudo systemctl reload apache2
#
# SetEnv values land in $_SERVER via mod_proxy_fcgi, which is what
# public_html/env.php reads. Change the DB password here, not in config.php.

<VirtualHost *:80>
    ServerName ewmarket.localhost
    DocumentRoot /mnt/data/freelance/ewmarket.sa/public_html

    SetEnv OC_URL      "http://ewmarket.localhost/"
    SetEnv DB_HOSTNAME "127.0.0.1"
    SetEnv DB_USERNAME "ewmarket"
    SetEnv DB_PASSWORD "Ewm@rket2026"
    SetEnv DB_DATABASE "ewmarket"
    SetEnv DB_PORT     "3306"

    <Directory /mnt/data/freelance/ewmarket.sa/public_html>
        AllowOverride All
        Require all granted
    </Directory>

    # storage/ sits outside the docroot, but block the in-tree copy anyway
    <Directory /mnt/data/freelance/ewmarket.sa/public_html/system/storage>
        Require all denied
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/ewmarket-error.log
    CustomLog ${APACHE_LOG_DIR}/ewmarket-access.log combined
</VirtualHost>
