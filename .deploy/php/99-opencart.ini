; OpenCart 3 runtime settings.
; Installed to /etc/php/8.3/{fpm,cli}/conf.d/ by scripts/setup-local.sh.
; Supersedes public_html/php.ini, which is dead weight from shared hosting.
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 5000
default_charset = UTF-8
allow_url_fopen = On

session.use_only_cookies = On
session.use_trans_sid = Off
session.cookie_httponly = On
session.gc_maxlifetime = 3600

; OpenCart 3.0.2 predates PHP 8 — deprecations are noisy but harmless.
; Keep E_ALL locally while porting, drop deprecations in production.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
