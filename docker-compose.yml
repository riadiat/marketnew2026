services:
  web:
    build: ./.docker
    ports:
      - "8080:80"
    environment:
      OC_URL: "http://localhost:8080/"
      DB_HOSTNAME: db
      DB_USERNAME: forge
      DB_PASSWORD: forge
      DB_DATABASE: ewmarket
      DB_PORT: "3306"
    volumes:
      # Mounted at the same absolute path the production config.php files use,
      # so DIR_* constants work unchanged.
      - .:/home/forge/ewmarket.sa
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "ewmarket.local:127.0.0.1"

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ewmarket
      MYSQL_USER: forge
      MYSQL_PASSWORD: forge
    ports:
      - "33061:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dbdata:
